[config]
schemaVersion = "0.0.1"

[package]
namespace = "frutos"
name = "CustomClanUIFixes"
versionNumber = "0.5.0"
description = "UI fixes for playing with many modded clans installed"
websiteUrl = "https://github.com/David-defrutos/mt2-custom-clan-ui-fixes"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
icon = "./icon-v2.png"
readme = "./README.md"
outdir = "./build"

# El DLL que baja de Actions y vive en la raiz de la carpeta del mod.
[[build.copy]]
source = "./mt2_custom_clan_ui_fixes.Plugin.dll"
target = "mt2_custom_clan_ui_fixes.Plugin.dll"

[publish]
repository = "https://thunderstore.io"
communities = [ "monster-train-2" ]
